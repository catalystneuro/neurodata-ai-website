- id: tutorials
  title: Tutorials you can run now
  blurb: Notebooks that open directly in a cloud environment, no installation required.
  items:
    - title: Reading NWB files and streaming from DANDI
      description: Open a Dandiset, stream a file without downloading it, and read the core data types.
      url: https://github.com/NeurodataWithoutBorders/nwb_hackathons/blob/main/HCK24_2025_Janelia_NDRH/notebooks/read_basics_and_stream.ipynb
      kind: tutorial
      colabUrl: https://colab.research.google.com/github/NeurodataWithoutBorders/nwb_hackathons/blob/main/HCK24_2025_Janelia_NDRH/notebooks/read_basics_and_stream.ipynb
    - title: Searching DANDI with the API, basic
      url: https://github.com/NeurodataWithoutBorders/nwb_hackathons/blob/main/HCK21_2024_Janelia_NDRH/tutorials/simple_dandiset_search.ipynb
      kind: tutorial
      colabUrl: https://colab.research.google.com/github/NeurodataWithoutBorders/nwb_hackathons/blob/main/HCK21_2024_Janelia_NDRH/tutorials/simple_dandiset_search.ipynb
    - title: Searching DANDI with the API, advanced
      url: https://github.com/NeurodataWithoutBorders/nwb_hackathons/blob/main/HCK21_2024_Janelia_NDRH/tutorials/advanced_asset_search.ipynb
      kind: tutorial
      colabUrl: https://colab.research.google.com/github/NeurodataWithoutBorders/nwb_hackathons/blob/main/HCK21_2024_Janelia_NDRH/tutorials/advanced_asset_search.ipynb
    - title: OpenScope DataBook
      description: Executable tutorials for the Allen Institute OpenScope datasets, from data access to analysis.
      url: https://alleninstitute.github.io/openscope_databook/
      kind: tutorial
    - title: DANDI example notebooks
      description: Community-contributed notebooks for individual Dandisets.
      url: https://github.com/dandi/example-notebooks
      kind: repo
- id: data
  title: Data standards and archives
  items:
    - title: NWB overview
      description: Start here if NWB is new to you.
      url: https://nwb-overview.readthedocs.io/
      kind: docs
    - title: PyNWB documentation
      description: Installation and tutorials for the Python API.
      url: https://pynwb.readthedocs.io/en/stable/install_users.html
      kind: docs
    - title: MatNWB documentation
      url: https://matnwb.readthedocs.io/
      kind: docs
    - title: DANDI Archive
      url: https://dandiarchive.org/
      kind: dataset
    - title: DANDI documentation
      url: https://docs.dandiarchive.org/
      kind: docs
    - title: Neurosift
      description: Browse Dandisets and visualize NWB files in the browser.
      url: https://neurosift.app/
      kind: tool
- id: tools
  title: Analysis tools taught at the school
  items:
    - title: SpikeInterface
      description: Spike sorting and extracellular electrophysiology analysis.
      url: https://spikeinterface.readthedocs.io/
      kind: tool
    - title: Kilosort
      url: https://github.com/MouseLand/Kilosort
      kind: tool
    - title: Pynapple
      description: Time series analysis for neurophysiology.
      url: https://pynapple.org/
      kind: tool
    - title: NeMoS
      description: Generalized linear models for neural data.
      url: https://nemos.readthedocs.io/
      kind: tool
    - title: suite2p, rastermap, Facemap, Cellpose
      description: Calcium imaging processing, dimensionality reduction, behavior, and segmentation.
      url: https://github.com/MouseLand
      kind: tool
    - title: Spyglass
      description: NWB plus DataJoint for reproducible analysis pipelines.
      url: https://lorenfranklab.github.io/spyglass/
      kind: tool
    - title: torch_brain
      description: Neural foundation models, including POYO.
      url: https://github.com/neuro-galaxy/torch_brain
      kind: tool
    - title: IBL Brain Wide Map
      url: https://dandiarchive.org/dandiset/000409
      kind: dataset
