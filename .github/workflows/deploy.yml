name: Build and deploy

# Builds main with the production settings and publishes it to the root of the
# gh-pages branch, which GitHub Pages serves at neurodata-ai.org. PR previews
# live in pr-<number>/ directories on the same branch (see preview.yml) and are
# left untouched by production deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://catalystneuro.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/neurodata-ai-website' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    # One writer to gh-pages at a time, shared with the preview workflow. Runs queue
    # rather than cancel so a production deploy is never dropped.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-gh-pages.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Publish to the root of gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-gh-pages.sh root dist
