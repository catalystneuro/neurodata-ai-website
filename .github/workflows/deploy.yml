name: Build and deploy

# Builds main with the production settings and publishes it to the root of the
# gh-pages branch, which GitHub Pages serves at neurodata-ai.org. PR previews
# live in pr-<number>/ directories on the same branch (see preview.yml) and are
# left untouched by production deploys. The daily run rebuilds the site so
# date-dependent content, such as the application deadline, updates on its own.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://catalystneuro.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/neurodata-ai-website' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    # One production publish at a time. GitHub keeps only the newest pending run in a
    # group, so this group is not shared with previews, which could otherwise push a
    # waiting production deploy out of the queue. Pushes from different groups are
    # reconciled by the retry-and-rebase loop in publish-gh-pages.sh.
    concurrency:
      group: gh-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-gh-pages.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Publish to the root of gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-gh-pages.sh root dist
